# Despliegue automático de AprendeFAE a Hostinger.
#
# Cada push a main compila el sitio y sube el resultado por FTP a public_html.
# Lo que se publica es SIEMPRE el build recién hecho aquí, no una carpeta dist
# del computador de nadie: dist/ está en .gitignore justamente para que la
# versión en vivo no dependa de quién subió el último build a mano.
#
# Las credenciales vienen de los secretos del repositorio y nunca aparecen en
# este archivo. GitHub las oculta también en los registros de ejecución.

name: Desplegar a producción

on:
  push:
    branches: [main]
  # Permite lanzarlo a mano desde la pestaña Actions, sin tener que inventar un
  # commit para reintentar un despliegue.
  workflow_dispatch:

# Solo un despliegue a la vez. Dos subidas por FTP simultáneas se pisan y dejan
# public_html a medias; `cancel-in-progress: false` deja terminar la que ya
# empezó en vez de abortarla con archivos a medio subir.
concurrency:
  group: despliegue-produccion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  desplegar:
    name: Compilar y publicar
    runs-on: ubuntu-latest

    # CERROJO DE REPOSITORIO. Desde que el repositorio es público, cualquiera
    # puede bifurcarlo y activar Actions en su copia. Sin esta condición, esa
    # copia intentaría desplegar a NUESTRO destino con los secretos que su
    # dueño ponga, o fallar ruidosamente contra una cuenta FTP que no es suya.
    #
    # Esto NO es lo que protege los secretos —eso ya lo hace GitHub, que nunca
    # entrega los secretos de este repositorio a una propuesta de cambio desde
    # una bifurcación— ni lo que impide que alguien de fuera dispare el
    # despliegue, que solo corre con un empujón a main y eso exige permiso de
    # escritura. Es el tercer cerrojo, el que atiende la copia ajena.
    if: github.repository == 'lugoxboop/aprendefae'

    env:
      # Raíz de aprendefae.com dentro de la cuenta FTP.
      #
      # NO es /public_html/. Esa es la del dominio principal de la cuenta;
      # aprendefae.com es un dominio adicional y cuelga de domains/. En el
      # servidor la ruta absoluta cuelga del home del usuario FTP, y como ese
      # usuario entra enjaulado en su home, aquí se escribe relativa a él.
      #
      # El nombre de ese usuario estaba escrito aquí y se quitó el 15 de
      # octubre de 2026, al abrir el repositorio. Un nombre de usuario no es
      # una contraseña, pero tampoco hace falta que esté a la vista. Sigue en
      # el historial de git, que no se reescribe: si alguna vez importa, lo
      # que se cambia es la contraseña en Hostinger, no este comentario.
      #
      # Subir a la carpeta equivocada NO da error: FTP crea lo que le pidan y
      # la ejecución sale en verde con el sitio intacto. Por eso el destino
      # está en una variable y se imprime abajo.
      RUTA_DESTINO: /domains/aprendefae.com/public_html/

    steps:
      - name: Traer el código
        uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          # La misma versión mayor que se usa en desarrollo.
          node-version: "24"
          cache: npm

      # `npm ci` y no `npm install`: instala exactamente lo que fija
      # package-lock.json, así el build de producción no cambia solo porque una
      # dependencia publicó una versión nueva.
      - name: Instalar dependencias
        run: npm ci

      # Un secreto con un carácter tipográfico (guion largo en vez de guion,
      # comilla curva) compila sin quejarse y rompe el sitio solo al intentar
      # entrar: fetch rechaza cabeceras con caracteres fuera de ISO-8859-1.
      # Vale más parar aquí que publicar un sitio sin login.
      #
      # Solo se imprime la longitud, nunca el valor.
      - name: Revisar los secretos del build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          fallo=0
          for nombre in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_GOOGLE_CLIENT_ID; do
            valor="${!nombre}"
            if [ -z "$valor" ]; then
              echo "FALTA    $nombre: el secreto no existe o está vacío"
              fallo=1
              continue
            fi
            # Todo lo que va en una cabecera HTTP tiene que ser ASCII imprimible.
            if printf '%s' "$valor" | LC_ALL=C grep -q '[^ -~]'; then
              echo "INVÁLIDO $nombre: tiene caracteres no ASCII (${#valor} caracteres)"
              echo "         Suele ser un guion largo o una comilla curva al copiar y pegar."
              fallo=1
            else
              echo "OK       $nombre: ${#valor} caracteres, ASCII limpio"
            fi
          done
          exit $fallo

      - name: Compilar
        run: npm run build
        env:
          # Vite incrusta estas variables DENTRO del build: tienen que existir
          # en este momento, no en el servidor. Sin ellas el sitio compila
          # igual, pero sale sin inicio de sesión, sin ranking y sin FP.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      # Red de seguridad: si el build no produjo lo esperado, es mejor parar
      # aquí que subir un sitio incompleto encima del que está funcionando.
      - name: Comprobar que el build salió completo
        run: |
          test -f dist/index.html || { echo "Falta dist/index.html"; exit 1; }
          test -f dist/privacidad/index.html || { echo "Falta dist/privacidad/index.html"; exit 1; }
          # El .htaccess es lo que pone Cache-Control en los index.html. Si
          # falta, el sitio funciona igual y los estudiantes se quedan con la
          # versión vieja durante días: exactamente el fallo silencioso que
          # este archivo vino a cerrar. Mejor parar aquí.
          test -f dist/.htaccess || { echo "Falta dist/.htaccess (¿se borró public/.htaccess?)"; exit 1; }
          echo "Build correcto. Contenido de dist/ (incluidos los ocultos):"
          ls -la dist

      # Un despliegue a la ruta equivocada sale en verde. Dejar el destino
      # escrito en el registro convierte "¿a dónde subió?" en una línea que se
      # lee, en vez de una investigación.
      - name: Destino de este despliegue
        run: |
          echo "Ruta remota : $RUTA_DESTINO"
          echo "Contenido local que se envía:"
          find dist -type f | sort

      - name: Subir a Hostinger por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          # `ftp` es FTP a secas: la contraseña viaja sin cifrar. Hostinger
          # admite FTPS explícito en este mismo puerto 21; en cuanto el primer
          # despliegue funcione, cambiar esta línea a `ftps` es la mejora de
          # seguridad más barata que tiene este archivo.
          protocol: ftp
          # Solo el resultado del build. Al apuntar a dist/, el código fuente,
          # node_modules y .git quedan fuera por construcción, no por filtro.
          local-dir: ./dist/
          server-dir: ${{ env.RUTA_DESTINO }}
          # Exclusiones explícitas, por si alguna herramienta deja rastros
          # dentro de dist/ en el futuro.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store

      # ═══════════════════════════════════════════════════════════════════════
      # SONDA DE POSTDESPLIEGUE — que el index.html llegue con Cache-Control
      #
      # POR QUÉ EXISTE. La cabecera la pone public/.htaccess, y ese archivo
      # empieza por punto. Que el build lo genere NO demuestra que el FTP lo
      # suba: un cliente de FTP que no mande los ocultos deja el despliegue en
      # verde, el sitio funcionando y la cabecera sin poner. Es el mismo tipo de
      # fallo silencioso que el archivo intenta resolver, así que no se da por
      # hecho: se mide contra el sitio en vivo.
      #
      # QUÉ MIRA. Que la portada responda con un Cache-Control que contenga
      # no-cache, y que un archivo de assets/ SIGA con su caché larga: si
      # alguien alguna vez amplía el .htaccess y se lleva por delante la caché
      # de los bundles, el sitio se pondría lento sin que nadie lo note.
      #
      # NO ESCRIBE NADA: son dos peticiones GET a una web pública.
      # ═══════════════════════════════════════════════════════════════════════
      - name: Sonda — el index.html llega con Cache-Control
        run: |
          fallo=0
          sitio="https://aprendefae.com"

          # La CDN de Hostinger puede tardar en soltar la copia anterior.
          for intento in 1 2 3; do
            portada=$(curl -sS -D - -o /dev/null --max-time 25 "$sitio/" | tr -d '\r')
            cc=$(printf '%s' "$portada" | grep -i '^cache-control:' | head -1)
            case "$cc" in
              *no-cache*) break ;;
            esac
            [ "$intento" = "3" ] && break
            echo "      Todavía sin no-cache en la portada. Reintento en 20 s ($intento/3)."
            sleep 20
          done

          case "$cc" in
            *no-cache*)
              echo "OK    la portada revalida en cada visita"
              echo "      $cc"
              ;;
            "")
              echo "ROJO  la portada NO trae Cache-Control."
              echo "      El .htaccess no está surtiendo efecto en producción."
              echo ""
              echo "      NO es que el FTP se salte los ocultos: está comprobado que"
              echo "      los sube —el propio .ftp-deploy-sync-state.json del action"
              echo "      es un archivo oculto y está en el servidor—. Y no sirve"
              echo "      pedir /.htaccess para ver si llegó: el servidor responde"
              echo "      403 a cualquier cosa que empiece por .ht exista o no."
              echo ""
              echo "      Lo que queda por mirar, en este orden:"
              echo "        1. ¿Corrió este despliegue? Lo dice la sonda de abajo."
              echo "        2. ¿Llegó el archivo? Lo dice el inventario de aquí abajo."
              echo "        3. Si llegó y aun así no hay cabecera, LiteSpeed está"
              echo "           ignorando las directivas: el <IfModule mod_headers.c>"
              echo "           evalúa falso y el archivo queda inerte sin dar error."
              fallo=1
              ;;
            *)
              echo "ROJO  la portada trae un Cache-Control que no revalida:"
              echo "      $cc"
              echo "      Un estudiante puede seguir con la versión vieja días."
              fallo=1
              ;;
          esac

          # Y los bundles con hash tienen que seguir con su caché larga.
          asset=$(curl -sS --max-time 25 "$sitio/" | grep -oE '/assets/main-[A-Za-z0-9_-]+.js' | head -1)
          if [ -z "$asset" ]; then
            echo "ROJO  no se encontró el bundle principal en la portada servida."
            fallo=1
          else
            cca=$(curl -sS -D - -o /dev/null --max-time 25 "$sitio$asset" | tr -d '\r' | grep -i '^cache-control:' | head -1)
            case "$cca" in
              *max-age=[1-9]*)
                echo "OK    $asset conserva su caché larga"
                echo "      $cca"
                ;;
              *)
                echo "ROJO  $asset perdió su caché larga: '$cca'"
                echo "      Los archivos con hash en el nombre pueden y deben cachearse."
                fallo=1
                ;;
            esac
          fi

          # ── Inventario de lo que hay REALMENTE en el servidor ──────────────
          #
          # El action de FTP deja en la raíz un .ftp-deploy-sync-state.json con
          # la lista de lo que subió y cuándo. Es público y no tiene nada
          # sensible —son las rutas de archivos que ya sirve la web—, y
          # convierte «no aparece la cabecera» en un diagnóstico con fecha:
          # dice si el despliegue vivo es este o uno anterior, y si el
          # .htaccess llegó a entrar.
          #
          # Se imprime SIEMPRE, salga verde o rojo: cuando sale verde no
          # estorba, y cuando sale rojo es justo lo que hace falta.
          estado=$(curl -sS --max-time 25 "$sitio/.ftp-deploy-sync-state.json" || true)
          printf '%s' "$estado" | node -e '
            let d = "";
            process.stdin.on("data", (c) => (d += c)).on("end", () => {
              try {
                const j = JSON.parse(d);
                /*
                 * El inventario es un objeto indexado por numero ("0", "1", ...),
                 * y el nombre del archivo esta en .name, NO en la clave. Leer las
                 * claves daba "no esta el .htaccess" con el .htaccess puesto.
                 */
                const entradas = Object.values(j.data ?? j).filter((x) => x && x.type === "file");
                const nombres = entradas.map((x) => x.name);
                const conta = nombres.filter((n) => /Contabilidad|Rombicub/i.test(n)).length;
                console.log("      Ultimo despliegue registrado : " + new Date(j.generatedTime).toISOString());
                console.log("      Archivos subidos             : " + entradas.length);
                console.log("      Esta el .htaccess?           : " + (nombres.includes(".htaccess") ? "si" : "NO"));
                console.log("      Esta el index.html?          : " + (nombres.includes("index.html") ? "si" : "NO"));
                if (conta) console.log("      Piezas de Contabilidad       : " + conta);
              } catch {
                console.log("      (no se pudo leer el inventario del servidor)");
              }
            });
          ' || true

          exit $fallo

      # ═══════════════════════════════════════════════════════════════════════
      # SONDA DE POSTDESPLIEGUE — que registrar_fp resuelva a UNA sola firma
      #
      # POR QUÉ EXISTE. La 0017 creó registrar_fp(text,integer,numeric,jsonb) y
      # no retiró la de (text,integer,numeric). Con las dos vivas, la llamada de
      # tres argumentos que hacen seis de las siete actividades coincidía con
      # ambas —p_detalle tiene default— y PostgREST devolvía PGRST203 sin
      # ejecutar nada. Los estudiantes veían su porcentaje y no recibían FP.
      #
      # Nada falló: ni el build, ni el despliegue, ni el sitio. Se descubrió
      # porque alguien lo notó jugando. Esta sonda existe para que la próxima
      # vez lo note la ejecución y no un estudiante.
      #
      # Y LOS PARÁMETROS CON NOMBRE NO SALVAN DE ESTO. Se comprobó contra la API
      # real: mandando los tres nombres, PGRST203 igual.
      #
      # QUÉ MIRA, Y QUÉ **NO**. Mira que cada forma de llamada RESUELVA a
      # exactamente una función. No mira que la función funcione.
      #
      #   · PGRST203 -> hay dos firmas vivas. Es el incidente. Rojo.
      #   · PGRST202 -> no encuentra la función con esos nombres. También rojo:
      #                 una migración se revirtió o se renombró un parámetro, y
      #                 el cliente lleva llamando al vacío.
      #   · 42501    -> resolvió una sola y paró en la guarda de permisos.
      #                 ALCANZABLE, que no es lo mismo que correcta.
      #
      # LA DIFERENCIA ENTRE "ALCANZABLE" Y "FUNCIONA" NO ES UNA SUTILEZA. Esta
      # sonda daba "OK ... resuelve a una sola función" para cualquier respuesta
      # que no fuera PGRST20x, y cerraba diciendo "Motor de FP y panel en pie".
      # Con panel_actividad rota por una columna ambigua —42702 al ejecutar— la
      # sonda salía en verde, porque el 42501 de la guarda se levanta ANTES de
      # llegar a la consulta rota. Esa lectura equivocada es literalmente lo que
      # llevó a descartar el servidor durante un diagnóstico.
      #
      # Sin sesión no hay forma de pasar de aquí: la guarda para toda llamada
      # anónima antes del cuerpo. Ejecutar el cuerpo de verdad es cosa del
      # workflow "Pruebas", que levanta un Postgres propio, aplica las
      # migraciones y corre supabase/tests/*.sql con un docente sembrado.
      #
      # NO PUEDE ESCRIBIR NADA. Va sin Authorization, así que el rol es "anon",
      # que no tiene execute sobre la función. Y aunque lo tuviera, auth.uid()
      # es null y registrar_fp lanza 'Se requiere sesión' antes de tocar una
      # tabla. Dos barreras, y ninguna depende de esta sonda.
      #
      # VA DESPUÉS DE LA SUBIDA A PROPÓSITO. Una base rota no es motivo para no
      # publicar el frontend: la versión anterior tampoco funcionaría. Lo que
      # hace falta es que la ejecución quede en rojo y se vea.
      #
      # CUÁNDO CORRERLA A MANO. Después de aplicar una migración que toque una
      # función: Actions -> Desplegar a producción -> Run workflow. Ese es
      # exactamente el momento en que se rompió, y el único que no cubría nada.
      # ═══════════════════════════════════════════════════════════════════════
      # ═══════════════════════════════════════════════════════════════════════
      # SONDA DE POSTDESPLIEGUE — que el servidor pueda pagar lo que se publicó
      #
      # POR QUÉ EXISTE. El 14 de octubre de 2026 había TRECE actividades
      # publicadas y jugables sin fila en actividad_catalogo: las dos de la 0052
      # y las once del bloque 0045-0051. Las siete migraciones estaban escritas,
      # correctas y en main; nunca se habían corrido. Un estudiante que jugara
      # cualquiera de las trece veía su porcentaje y no recibía un solo FP.
      #
      # Y NINGUNA PRUEBA PODÍA VERLO: catalogo.test.mjs compara el cliente
      # contra los ARCHIVOS de migración, y los archivos estaban todos. Una
      # migración escrita y nunca corrida es invisible para la suite. Lo único
      # que la caza es preguntarle a la base, y eso solo se puede hacer aquí.
      #
      # LA HERMANA DE LA SONDA DE ABAJO. Esa comprueba que registrar_fp sea
      # ALCANZABLE; esta, que tenga a quién pagarle. Las dos juntas cubren el
      # motor de FP por los dos lados.
      #
      # NO ESCRIBE NADA: una sola petición GET con la llave pública, que puede
      # leer el catálogo desde la 0150 y no puede escribirlo (RLS lo niega con
      # 42501, comprobado).
      #
      # SI VINIERA VACÍO, ES ROJO. Antes de la 0150, PostgREST respondía HTTP
      # 200 con lista vacía: éxito con cero filas. La sonda distingue «no falta
      # ninguna» de «no pude leer», porque confundirlos sería peor que no
      # tenerla.
      # ═══════════════════════════════════════════════════════════════════════
      - name: Sonda — el servidor puede pagar lo que el sitio ofrece
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node --import ./scripts/cargador-jsx.mjs scripts/sonda-catalogo.mjs

      - name: Sonda — registrar_fp resuelve a una sola firma
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          probar() {
            etiqueta="$1"
            funcion="$2"
            cuerpo="$3"

            # Un solo reintento, y solo por PGRST202: tras una migración,
            # PostgREST puede tardar unos segundos en recargar su caché de
            # esquema. Sin esto la sonda daría falsas alarmas legítimas.
            for intento in 1 2; do
              respuesta=$(curl -sS --max-time 20 -w '\n%{http_code}' \
                -X POST "$VITE_SUPABASE_URL/rest/v1/rpc/$funcion" \
                -H "apikey: $VITE_SUPABASE_ANON_KEY" \
                -H "Content-Type: application/json" \
                -d "$cuerpo")
              codigo=$(printf '%s' "$respuesta" | tail -n1)
              respuesta=$(printf '%s' "$respuesta" | sed '$d')

              case "$respuesta" in
                *PGRST203*)
                  echo "ROJO  $etiqueta"
                  echo "      HAY DOS FIRMAS VIVAS de registrar_fp. HTTP $codigo"
                  echo "      $respuesta"
                  echo "      Quien la llame así NO está obteniendo nada."
                  echo "      Arreglo: retirar la sobrante con drop function."
                  return 1
                  ;;
                *PGRST202*)
                  if [ "$intento" = "1" ]; then
                    echo "      $etiqueta: no la encuentra. Puede ser la caché de"
                    echo "      esquema tras una migración. Reintento en 15 s."
                    sleep 15
                    continue
                  fi
                  echo "ROJO  $etiqueta"
                  echo "      PostgREST NO ENCUENTRA $funcion con esos nombres de"
                  echo "      parámetro, dos veces seguidas. HTTP $codigo"
                  echo "      $respuesta"
                  echo "      El cliente la llama al vacío: esa parte del sitio no funciona."
                  echo "      SI ACABAS DE SUBIR CÓDIGO Y NO HAS CORRIDO LA MIGRACIÓN"
                  echo "      QUE CREA ESTA FUNCIÓN, esto es lo esperado: córrela y"
                  echo "      relanza el despliegue desde Actions."
                  return 1
                  ;;
                *42501*)
                  # Lo esperado: resolvió una sola función y la guarda la paró.
                  echo "ALCANZABLE  $etiqueta — una sola firma; la guarda la paró (HTTP $codigo)"
                  echo "            El cuerpo NO se ejecutó: esta sonda no puede decir si funciona."
                  return 0
                  ;;
                *)
                  # Cualquier otra cosa es desconocida, y desconocido no es OK.
                  # Un 42702, un 42883 o un error de red caían aquí y se
                  # registraban como "resuelve a una sola función".
                  echo "ROJO  $etiqueta"
                  echo "      Respuesta que esta sonda no sabe interpretar. HTTP $codigo"
                  echo "      $respuesta"
                  echo "      Sin sesión, lo único esperado es 42501. Cualquier otra cosa"
                  echo "      significa que la llamada llegó más lejos de lo que debería,"
                  echo "      o que el servidor respondió algo que nadie previó."
                  return 1
                  ;;
              esac
            done
          }

          fallo=0

          # El motor de FP: las dos formas de llamada que hacen las actividades.
          probar "registrar_fp · 3 argumentos (seis actividades)" registrar_fp \
            '{"p_activity_id":"diagnostico-en-vivo","p_duration_ms":120000,"p_correct_pct":100}' || fallo=1
          probar "registrar_fp · 4 argumentos (la que manda detalle)" registrar_fp \
            '{"p_activity_id":"diagnostico-en-vivo","p_duration_ms":120000,"p_correct_pct":100,"p_detalle":[]}' || fallo=1

          # Y el panel docente, desde la 0019.
          #
          # POR QUÉ ENTRAN AQUÍ. Para poder añadirle columnas, la 0019 tuvo que
          # DROPEAR y recrear panel_estudiantes: Postgres no deja cambiar el
          # tipo de retorno con create or replace. Esa es exactamente la
          # maniobra que la semana pasada dejó dos firmas vivas de registrar_fp
          # y seis actividades sin pagar FP. Aquí el riesgo es el contrario
          # —que un drop deje CERO— y esta sonda lo ve igual de bien: sin la
          # función, PostgREST responde PGRST202 en vez de 42501.
          probar "panel_estudiantes" panel_estudiantes '{"p_subject":"macroeconomia"}' || fallo=1
          probar "panel_resumen" panel_resumen '{"p_subject":"macroeconomia"}' || fallo=1
          probar "panel_historial" panel_historial \
            '{"p_subject":"macroeconomia","p_user":"00000000-0000-0000-0000-000000000000"}' || fallo=1

          # Y las dos de la vista por actividad, desde la 0021.
          probar "panel_actividad" panel_actividad \
            '{"p_subject":"macroeconomia","p_activity_id":"proyecto-arca"}' || fallo=1
          probar "panel_items" panel_items \
            '{"p_subject":"macroeconomia","p_activity_id":"proyecto-arca"}' || fallo=1

          if [ "$fallo" = "0" ]; then
            echo ""
            echo "Las siete llamadas resuelven a UNA SOLA función y llegan a su guarda."
            echo ""
            echo "Eso es todo lo que esto comprueba. NO dice que las funciones"
            echo "devuelvan lo correcto, ni que se ejecuten sin error: sin sesión,"
            echo "ninguna llega a ejecutar su cuerpo. De eso se ocupa el workflow"
            echo "\"Pruebas\", que corre las migraciones y los tests SQL sobre un"
            echo "Postgres limpio."
          fi
          exit $fallo
