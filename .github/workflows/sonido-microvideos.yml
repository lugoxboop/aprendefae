# Sonido de los microvideos de los Aprender (Jane): música nueva, voz aislada y muestras de voces
# con la API de ElevenLabs. Corre aquí porque el shell de la nube no tiene salida a
# api.elevenlabs.io y aquí vive el secreto ELEVENLABS_API_KEY.
# Se dispara empujando un cambio al pedido. Lo que produce se confirma a la MISMA rama.
name: Sonido de microvideos

on:
  push:
    branches: ["claude/**"]
    paths: ["orquestador/conocimiento/jane/microvideos/macro/sonido/pedido.json"]

concurrency:
  group: sonido-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  eleven:
    runs-on: ubuntu-latest
    if: github.repository == 'lugoxboop/aprendefae'
    timeout-minutes: 30
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24" }
      - name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: ElevenLabs
        run: node orquestador/conocimiento/jane/microvideos/macro/sonido/eleven.mjs
      - name: Confirmar a la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add orquestador/conocimiento/jane/microvideos/macro/sonido
          git diff --cached --quiet && exit 0
          git commit -m "Sonido: salida de ElevenLabs (música, voz aislada, muestras de voces)"
          for i in 1 2 3 4; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break; sleep $((i*5)); done
