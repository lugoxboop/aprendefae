<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Corte del símbolo optimizado para 16px: trazo más grueso (3) y nodos algo
    mayores (base 3.8, vértice 4.1) para que la forma no se cierre al reducir.
    Fondo navy sólido para que la marca se lea igual en pestañas claras y oscuras.
  -->
  <rect width="32" height="32" rx="7" fill="#1D3557"/>
  <path d="M6 24 L16 7 L26 24" stroke="#F8F9FA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="6" cy="24" r="3.8" fill="#F8F9FA"/>
  <circle cx="26" cy="24" r="3.8" fill="#F8F9FA"/>
  <circle cx="16" cy="7" r="4.1" fill="#E76F51"/>
</svg>
